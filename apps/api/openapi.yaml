      properties:
        variant_width: { type: integer, enum: [320, 640, 1280, 1920] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        bytes: { type: integer, minimum: 1 }
        mime: { const: image/webp }
    ListingMediaResponse:
      type: object
      required: [id, media_asset_id, display_order, is_cover, status, review_status, next_action, mime_type, size_bytes, width, height, variants, failure_code, retryable]
      properties:
