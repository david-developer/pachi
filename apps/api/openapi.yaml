      security: [{"bearerAuth":[]}]
      description: "Invite LISTING_MANAGER, AGENT or ANALYST only. expected_version is the organization version. Token is digest-only and valid seven days, bound to the current authoritative verified recipient phone. Default runtime private delivery unavailable; isolated tests inject a private sink."
      parameters: [{"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/OrganizationInvitationCreateRequest"}}}}
