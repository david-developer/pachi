        field: { type: string }
        label: { type: string }
        status: { type: string, enum: [READY, BLOCKED] }
        message: { type: [string, 'null'] }
    ListingSubmissionMediaSnapshot:
      type: object
      required: [listing_media_id, media_asset_id, display_order, is_cover]
      properties:
        listing_media_id: { type: string, format: uuid }
        media_asset_id: { type: string, format: uuid }
        display_order: { type: integer, minimum: 0 }
        is_cover: { type: boolean }
    ListingSubmissionResponse:
      type: object
      required: [id, listing_id, revision_id, offering_version_id, submitted_at, media_snapshot]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        revision_id: { type: string, format: uuid }
        offering_version_id: { type: string, format: uuid }
        submitted_at: { type: string, format: date-time }
        media_snapshot: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/ListingSubmissionMediaSnapshot' } }
    ListingReadinessResponse:
      type: object
      required: [listing_id, publication_status, moderation_status, revision_id, revision_version, offering_id, offering_version_id, can_submit, checks, submission]
      properties:
        listing_id: { type: string, format: uuid }
        publication_status: { type: string, enum: [DRAFT, PENDING_REVIEW] }
        moderation_status: { type: string, enum: [NOT_REVIEWED, IN_REVIEW] }
        revision_id: { type: string, format: uuid }
        revision_version: { type: integer, minimum: 1 }
        offering_id: { type: string, format: uuid }
        offering_version_id: { type: string, format: uuid }
        can_submit: { type: boolean }
        checks: { type: array, items: { $ref: '#/components/schemas/ListingReadinessCheck' } }
        submission: { anyOf: [{ $ref: '#/components/schemas/ListingSubmissionResponse' }, { type: 'null' }] }
    ListingSubmissionRequest:
      type: object
      required: [revision_id, offering_version_id]
      properties:
        revision_id: { type: string, format: uuid }
        offering_version_id: { type: string, format: uuid }
    ListingSubmissionCommandResponse:
      type: object
      required: [submitted, idempotent, submission, readiness]
      properties:
        submitted: { type: boolean }
        idempotent: { type: boolean }
        submission: { anyOf: [{ $ref: '#/components/schemas/ListingSubmissionResponse' }, { type: 'null' }] }
        readiness: { $ref: '#/components/schemas/ListingReadinessResponse' }
