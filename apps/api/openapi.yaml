openapi: 3.1.0
info:
  title: Pachi API
  version: 0.1.0
  description: Identity foundation and private individual-provider property/listing draft operations. Listings remain private until an eligible revision is submitted for review; approval and publication are separate operations.
paths:
  /v1/health/live:
    get:
      security: []
      responses:
        '200': { description: Process liveness }
  /v1/health/ready:
    get:
      security: []
      responses:
        '200': { description: Database readiness }
        '503': { description: Database unavailable }
  /v1/dev/local-sms/{challengeId}:
    parameters:
      - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      description: Development-only loopback SMS sink; unavailable in production. A challenge identifier is required.
      security: []
      responses:
        '200': { description: Local development delivery }
        '404': { description: Not available }
  /v1/staff/session:
    get:
      summary: Read the current registered staff session and eligible grants
      description: Requires a signed staff-client access token with pachi/staff scope, server-recorded required-TOTP evidence, an eligible application identity, unexpired session and current grant. Marketplace tokens/cookies are not accepted. No public staff bootstrap endpoint exists.
      security: [{ staffBearerAuth: [] }]
      responses:
        '200':
          description: Safe staff projection without internal authentication identifiers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffSession' }
        '401': { description: Invalid staff token, missing registration/MFA evidence, revoked session or idle/absolute expiry }
        '403': { description: No current eligible StaffGrant }
  /v1/staff/verification-cases/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      security: [{ staffBearerAuth: [] }]
      description: Assigned officer reads case metadata; case scoped provider:verify grant required.
      responses: { '200': { description: Assigned case, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderVerificationCase' } } } }, '403': { description: Case scope denied } }
  /v1/staff/authority-risk-cases:
    post:
      security: [{ staffBearerAuth: [] }]
      description: Assigned TRUST_SAFETY_MODERATOR records a scoped reported allegation. Case ID and property must match an existing current case grant; no document intake.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id, propertyId, subjectScope, triggerKind, allegationKind, provenance, reasonCode], properties: { id: { type: string, format: uuid }, propertyId: { type: string, format: uuid }, relationshipId: { type: [string, 'null'], format: uuid }, principalId: { type: [string, 'null'], format: uuid }, subjectScope: { type: string, enum: [PROPERTY, RELATIONSHIP, PRINCIPAL] }, triggerKind: { type: string, enum: [DISPUTE, REPRESENTATION, FRAUD] }, allegationKind: { type: string, enum: [REPORTED] }, provenance: { type: string, enum: [STAFF_OBSERVATION, PROVIDER_REPORT, THIRD_PARTY_REPORT] }, reasonCode: { type: string } } } } } }
      responses: { '201': { description: Audited precautionary case, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorityRiskCase' } } } }, '403': { description: Current case grant, assignment or step up missing }, '409': { description: Invalid subject or reference } }
  /v1/staff/authority-risk-cases/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      security: [{ staffBearerAuth: [] }]
      description: Assigned case-scoped moderator reads safe case status. Private source references require separate evidence access.
      responses: { '200': { description: Assigned case, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorityRiskCase' } } } }, '403': { description: Scope denied } }
  /v1/staff/authority-risk-cases/{id}/claim-legacy:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      security: [{ staffBearerAuth: [] }]
      description: Scoped moderator takes the explicitly granted legacy review case without inventing a historic actor or decision.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expected_version], properties: { expected_version: { type: integer, minimum: 1 } } } } } }
      responses: { '201': { description: Audited assignment, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorityRiskCase' } } } }, '403': { description: Scope denied }, '409': { description: Stale version } }
  /v1/staff/authority-risk-cases/{id}/decision:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      security: [{ staffBearerAuth: [] }]
      description: Assigned moderator reviews a permitted internal source, then confirms or resolves a specific trigger by referencing that audited source-review action. In v1, internal-source disproval is limited to a relationship-scoped representation finding and that same relationship's structured record. A property pointer cannot disprove a dispute, fraud finding, or adverse authority history. Current case and evidence grants plus recent TOTP required; resolution stales evaluation and never grants authority.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expected_version, outcome, reason_code, evidence_ref_type, evidence_ref_id], properties: { expected_version: { type: integer, minimum: 1 }, outcome: { type: string, enum: [REVIEW_SOURCE, CONFIRM, RESOLVE] }, reason_code: { type: string }, evidence_ref_type: { type: string, enum: [PROPERTY, RELATIONSHIP, CASE_ACTION, MERGE] }, evidence_ref_id: { type: string, format: uuid } } } } } }
      responses: { '201': { description: Audited versioned decision, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorityRiskCase' } } } }, '403': { description: Scope or step up missing }, '409': { description: Missing support or stale decision } }
  /v1/staff/verification-cases/{id}/evidence/{kind}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: kind, in: path, required: true, schema: { type: string, enum: [GOVERNMENT_ID, LIVE_SELFIE] } }]
    get:
      security: [{ staffBearerAuth: [] }]
      description: Assigned evidence:read officer with recent TOTP only; access audited and never public.
      responses: { '200': { description: Private synthetic test evidence }, '403': { description: Scope or step up required } }
  /v1/staff/verification-cases/{id}/decision:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      security: [{ staffBearerAuth: [] }]
      description: Assigned provider:verify officer with recent TOTP decides a reviewed PENDING case at the expected version.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expected_version, outcome, reason_code], properties: { expected_version: { type: integer, minimum: 1 }, outcome: { type: string, enum: [VERIFIED, REJECTED, NEEDS_RESUBMISSION] }, reason_code: { type: string } } } } } }
      responses: { '201': { description: Recorded decision, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderVerificationCase' } } } }, '403': { description: Scope or step up required }, '409': { description: Invalid or stale decision } }
  /v1/staff/verification-cases/{id}/assign:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      security: [{ staffBearerAuth: [] }]
      description: Recent authenticated admin:permissions_manage operator assigns an officer who already has an unexpired case scoped provider:verify grant. Assignment does not grant review rights.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [staff_user_id, expected_version], properties: { staff_user_id: { type: string, format: uuid }, expected_version: { type: integer, minimum: 1 } } } } } }
      responses: { '201': { description: Assigned case, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderVerificationCase' } } } }, '403': { description: Scope or step up required }, '409': { description: Stale version } }
  /v1/staff/listing-photos:
    get:
      security: [{ staffBearerAuth: [] }]
      description: Pending READY photos in the current LISTING_MODERATOR region scope, excluding the moderator's own listing. Production local storage adapter remains disabled.
      responses:
        '200': { description: Scoped photo queue, content: { application/json: { schema: { type: object, required: [photos], properties: { photos: { type: array, items: { $ref: '#/components/schemas/ListingPhotoReviewItem' } } } } } } }
        '401': { description: Staff authentication required }
        '503': { description: Private photo storage adapter unavailable }
  /v1/staff/listing-photos/{id}/variants/{width}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: width, in: path, required: true, schema: { type: integer, enum: [320, 640] } }]
    get:
      security: [{ staffBearerAuth: [] }]
      description: Recent authenticated LISTING_MODERATOR in exact region scope receives an audited private preview of a current READY pending photo.
      responses:
        '200': { description: Private no-store image preview, content: { image/webp: { schema: { type: string, format: binary } } } }
        '403': { description: Scope or recent reauthentication required }
        '409': { description: Photo is no longer pending }
  /v1/staff/listing-photos/{id}/decision:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      security: [{ staffBearerAuth: [] }]
      description: Versioned review of the exact photo association and asset. Any decision requires an audited preview by the same moderator. Decision, audit and outbox commit together; no publication occurs.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [media_asset_id, expected_version, outcome, reason_code, idempotency_key], properties: { media_asset_id: { type: string, format: uuid }, expected_version: { type: integer, minimum: 1 }, outcome: { type: string, enum: [APPROVED, CHANGES_REQUIRED, REJECTED] }, reason_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$' }, idempotency_key: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Recorded or idempotently replayed decision, content: { application/json: { schema: { $ref: '#/components/schemas/ListingPhotoReviewItem' } } } }
        '403': { description: Scope or recent reauthentication required }
        '409': { description: Invalid, stale or conflicting decision }
  /v1/auth/bootstrap:
    post:
      summary: Resolve an access-token identity and register its session
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapRequest' }
      responses:
        '201': { description: Bootstrap result, content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapResponse' } } } }
        '401': { description: Invalid, expired, wrong-type, wrong-client, or insufficient-scope token }
  /v1/account/me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current account, content: { application/json: { schema: { $ref: '#/components/schemas/AccountResponse' } } } }
  /v1/account/sessions:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Safe current-user sessions, content: { application/json: { schema: { $ref: '#/components/schemas/SessionListResponse' } } } }
  /v1/account/logout:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: Current session revoked } }
  /v1/account/logout-all:
    post:
      security: [{ bearerAuth: [] }]
      responses: { '201': { description: All current-user sessions revoked } }
  /v1/account/provider:
    get:
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Individual provider overview or empty provider, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderOverviewResponse' } } } } }
  /v1/account/provider/onboard:
    post:
      security: [{ bearerAuth: [] }]
      description: Create or edit the authenticated individual's provider profile. Editing public details does not activate the provider or change verification status; capacity is locked during review or while a current verified claim exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_types, display_name]
              properties:
                provider_types: { type: array, minItems: 1, items: { type: string, enum: [OWNER, INDEPENDENT_AGENT, PROPERTY_MANAGER] } }
                display_name: { type: string, minLength: 2, maxLength: 120 }
                bio: { type: string, maxLength: 1000 }
                service_area: { type: string, maxLength: 240 }
      responses: { '201': { description: Current individual provider profile after create or edit, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderOverviewResponse' } } } }, '409': { description: Account or profile state is ineligible, capacity locked, or input invalid } }
  /v1/account/provider/verification:
    get:
      security: [{ bearerAuth: [] }]
      description: Current applicant's latest provider identity case and permitted next action; no evidence, reviewer notes or storage keys.
      responses: { '200': { description: Applicant case status, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderVerificationStatus' } } } } }
    post:
      security: [{ bearerAuth: [] }]
      description: Submit only explicit synthetic local test evidence. Real identity intake remains disabled until E01; actual documents are rejected.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [capacity, government_id, live_selfie, idempotency_key], properties: { capacity: { type: string, enum: [OWNER, INDEPENDENT_AGENT, PROPERTY_MANAGER] }, government_id: { type: string }, live_selfie: { type: string }, idempotency_key: { type: string } } } } } }
      responses: { '201': { description: Pending case, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderVerificationCase' } } } }, '403': { description: Provider scope denied }, '409': { description: Pending case or invalid input }, '503': { description: E01 intake gate unavailable } }
  /v1/account/properties:
    get:
      summary: List properties and provider declarations owned by the current provider
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current provider property records and their separate relationship declarations, content: { application/json: { schema: { type: object, required: [properties], properties: { properties: { type: array, items: { $ref: '#/components/schemas/PropertyDraftResponse' } } } } } } }
        '409': { description: Provider profile is not eligible for private workspace access }
    post:
      summary: Create a property and its provider relationship declaration
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyCreateRequest' }
      responses:
        '201': { description: Created property and DECLARED provider relationship, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDraftResponse' } } } }
        '401': { description: Authentication required }
        '409': { description: Provider is ineligible or property input is invalid }
  /v1/account/properties/{id}/specifications:
    patch:
      summary: Edit physical specifications on an owned property with only draft listings
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertySpecificationsUpdateRequest' }
      responses:
        '200': { description: Updated property specifications and incremented version, content: { application/json: { schema: { $ref: '#/components/schemas/PropertyDraftResponse' } } } }
        '404': { description: Property unavailable to this provider }
        '409': { description: Invalid values, stale version, or non-draft listing state }
  /v1/account/listing-drafts:
    get:
      summary: List the current provider's private listing drafts
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Private listing draft snapshots with current listing revision and offering version, content: { application/json: { schema: { type: object, required: [drafts], properties: { drafts: { type: array, items: { $ref: '#/components/schemas/ListingDraftResponse' } } } } } } }
        '409': { description: Provider profile is not eligible for private workspace access }
    post:
      summary: Create a private listing draft with an initial revision and offering version
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingDraftCreateRequest' }
      responses:
        '201': { description: Unpublished draft and current XAF offering terms, content: { application/json: { schema: { $ref: '#/components/schemas/ListingDraftResponse' } } } }
        '401': { description: Authentication required }
        '409': { description: Provider eligibility, property ownership, purpose, or offering terms rejected }
  /v1/account/listing-drafts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Reopen one current-provider private listing draft
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current draft revision and offering version, content: { application/json: { schema: { $ref: '#/components/schemas/ListingDraftResponse' } } } }
        '401': { description: Authentication required }
        '404': { description: Draft does not exist or is outside the current provider scope }
    patch:
      summary: Create a new listing revision and offering version for a private draft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingDraftUpdateRequest' }
      responses:
        '200': { description: Updated private draft with incremented revision and offering versions, content: { application/json: { schema: { $ref: '#/components/schemas/ListingDraftResponse' } } } }
        '401': { description: Authentication required }
        '409': { description: Draft outside provider scope or invalid purpose-specific offering terms }
  /v1/account/listing-drafts/{id}/readiness:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Evaluate backend-owned readiness for private listing submission
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Field-level readiness checks and current revision/offering snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/ListingReadinessResponse' } } } }
        '401': { description: Authentication required }
        '404': { description: Draft does not exist or is outside the current provider scope }
        '409': { description: Provider is not eligible for private workspace access }
  /v1/account/listing-drafts/{id}/authority-risk/evaluate:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      security: [{ bearerAuth: [] }]
      description: Owner requests the named system evaluator for an own DRAFT. CLEAR checks Pachi internal sources only; it does not prove ownership, accept evidence, submit or publish.
      responses: { '201': { description: Current internal authority risk status, content: { application/json: { schema: { $ref: '#/components/schemas/AuthorityRiskStatus' } } } }, '404': { description: Draft is outside provider scope }, '409': { description: Evaluation unavailable } }
  /v1/account/listing-drafts/{id}/submissions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Submit a ready private listing revision for staff review
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: idempotency-key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingSubmissionRequest' }
      responses:
        '201': { description: Submitted exact revision for review; this does not approve or publish the listing, content: { application/json: { schema: { $ref: '#/components/schemas/ListingSubmissionCommandResponse' } } } }
        '200': { description: Idempotent replay of the existing submission, content: { application/json: { schema: { $ref: '#/components/schemas/ListingSubmissionCommandResponse' } } } }
        '401': { description: Authentication required }
        '404': { description: Draft does not exist or is outside the current provider scope }
        '409': { description: Stale revision/offering, invalid lifecycle, or provider scope }
        '422': { description: Current listing readiness has actionable blockers }
  /v1/account/listing-drafts/{id}/media:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: List private photo metadata and processing states for an owned draft
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Private draft media; storage references are never returned, content: { application/json: { schema: { type: object, required: [media], properties: { media: { type: array, items: { $ref: '#/components/schemas/ListingMediaResponse' } } } } } } }
        '404': { description: Draft does not exist or is outside the current provider scope }
        '409': { description: Current account/provider is not eligible for private media access }
    post:
      summary: Upload a photo to an owned private draft; content is quarantined until worker processing completes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '202': { description: Upload stored privately and queued for scanning and processing, content: { application/json: { schema: { $ref: '#/components/schemas/ListingMediaUploadResponse' } } } }
        '400': { description: Invalid image bytes or request content type does not match the file signature }
        '401': { description: Authentication required }
        '404': { description: Draft does not exist or is outside the current provider scope }
        '409': { description: Provider is ineligible, listing/provider quota reached, or upload concurrency/rate limit reached }
        '413': { description: Original image exceeds 15 MiB }
        '503': { description: Private local storage is temporarily unavailable }
  /v1/account/listing-drafts/{id}/media/order:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Reorder owned draft photos and choose a READY cover image
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingMediaOrderRequest' }
      responses:
        '200': { description: Persisted order and cover, content: { application/json: { schema: { type: object, required: [media], properties: { media: { type: array, items: { $ref: '#/components/schemas/ListingMediaResponse' } } } } } } }
        '404': { description: Draft does not exist or is outside the current provider scope }
        '409': { description: Supplied photos or cover are not valid for this draft }
  /v1/account/listing-drafts/{id}/media/{mediaAssetId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: mediaAssetId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Remove a photo from an owned private draft and queue private object cleanup
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated draft photos, content: { application/json: { schema: { type: object, required: [media], properties: { media: { type: array, items: { $ref: '#/components/schemas/ListingMediaResponse' } } } } } } }
        '404': { description: Draft or photo does not exist in the current provider scope }
  /v1/account/listing-drafts/{id}/media/{mediaAssetId}/retry:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: mediaAssetId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Retry a transient failed photo scan or processing job
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Photo returned to the private processing queue, content: { application/json: { schema: { type: object, required: [status], properties: { status: { const: UPLOADED_QUARANTINED } } } } } }
        '404': { description: Draft or photo does not exist in the current provider scope }
        '409': { description: Failure is permanent or retry limit reached }
  /v1/account/listing-drafts/{id}/media/{mediaAssetId}/variants/{width}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: mediaAssetId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: width, in: path, required: true, schema: { type: integer, enum: [320, 640, 1280, 1920] } }
    get:
      summary: Read one processed photo variant for its owning provider only
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Private WebP derivative, headers: { Cache-Control: { schema: { type: string, const: 'private, no-store' } } }, content: { image/webp: { schema: { type: string, format: binary } } } }
        '404': { description: Draft or photo does not exist in the current provider scope }
        '409': { description: Photo is not READY }
  /v1/account/phone/request:
    post:
      summary: Request a PHONE_OWNERSHIP OTP
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties: { phone: { type: string, description: Cameroon E.164 number } }
      responses:
        '201': { description: Accepted for isolated delivery, content: { application/json: { schema: { $ref: '#/components/schemas/PhoneRequestResponse' } } } }
        '400': { description: Invalid Cameroon phone number }
        '429': { description: Cooldown or hourly send limit }
  /v1/account/phone/confirm:
    post:
      summary: Confirm PHONE_OWNERSHIP with an OTP
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, challenge_id, code]
              properties:
                phone: { type: string }
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '201': { description: Verified, content: { application/json: { schema: { $ref: '#/components/schemas/PhoneConfirmResponse' } } } }
        '401': { description: Invalid, expired, superseded, reused, or exhausted code }
        '409': { description: Account restricted or phone already owned }
components:
  securitySchemes:
    staffBearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Separate staff issuer/client access token with pachi/staff scope }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    ProviderVerificationCase:
      type: object
      required: [id, provider_profile_id, state, version, policy_version, submitted_at, decision_at, reason_code, valid_until, previous_case_id, next_action]
      properties:
        id: { type: string, format: uuid }
        provider_profile_id: { type: string, format: uuid }
        state: { type: string, enum: [PENDING, NEEDS_RESUBMISSION, VERIFIED, REJECTED, EXPIRED, REVOKED] }
        version: { type: integer }
        policy_version: { type: string }
        submitted_at: { type: string, format: date-time }
        decision_at: { type: [string, 'null'], format: date-time }
        reason_code: { type: [string, 'null'] }
        valid_until: { type: [string, 'null'], format: date-time }
        previous_case_id: { type: [string, 'null'], format: uuid }
        next_action: { type: string, enum: [WAIT_FOR_REVIEW, SUBMIT_CORRECTION, SUBMIT_NEW_CASE, RENEW, CONTACT_SUPPORT, NONE] }
    ProviderVerificationStatus:
      type: object
      required: [case, synthetic_intake_available]
      properties:
        case: { oneOf: [{ $ref: '#/components/schemas/ProviderVerificationCase' }, { type: 'null' }] }
        synthetic_intake_available: { type: boolean }
    StaffSession:
      type: object
      additionalProperties: false
      required: [display_name, grants, absolute_expires_at, idle_expires_at, reauthentication_expires_at]
      properties:
        display_name: { type: string }
        absolute_expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        reauthentication_expires_at: { type: string, format: date-time }
        grants:
          type: array
          items:
            type: object
            required: [role, scope, expires_at]
            properties:
              role: { type: string, enum: [SUPER_ADMIN, VERIFICATION_OFFICER, LISTING_MODERATOR, TRUST_SAFETY_MODERATOR, SUPPORT_AGENT, ANALYST] }
              expires_at: { type: string, format: date-time }
              scope:
                type: object
                required: [kind, id, permissions]
                properties:
                  kind: { type: string, enum: [platform, region, case] }
                  id: { type: string }
                  permissions: { type: array, items: { type: string } }
                  property_id: { type: string }
    AuthorityRiskStatus:
      type: object
      required: [status, next_action, evaluation_id]
      properties:
        status: { type: string, enum: [CLEAR, HOLD, INCOMPLETE, STALE, UNEVALUATED] }
        next_action: { type: string }
        evaluation_id: { type: [string, 'null'] }
    AuthorityRiskCase:
      type: object
      required: [id, property_id, relationship_id, principal_id, subject_scope, trigger_kind, allegation_kind, state, version, reason_code, safe_remediation, source_provenance, received_at, source_review_action_id]
      properties:
        id: { type: string }
        property_id: { type: string }
        relationship_id: { type: [string, 'null'] }
        principal_id: { type: [string, 'null'] }
        subject_scope: { type: string }
        trigger_kind: { type: string }
        allegation_kind: { type: string }
        state: { type: string }
        version: { type: integer }
        reason_code: { type: string }
        safe_remediation: { type: string }
        source_provenance: { type: string }
        received_at: { type: [string, 'null'] }
        source_review_action_id: { type: [string, 'null'] }
    BootstrapRequest:
      type: object
      properties: { device_label: { type: string, maxLength: 120 } }
    Participation:
      oneOf:
        - type: object
          required: [allowed]
          properties: { allowed: { const: true } }
        - type: object
          required: [allowed, reason]
          properties: { allowed: { const: false }, reason: { const: PHONE_REQUIRED } }
    BootstrapResponse:
      type: object
      required: [user_id, session_id, account_state, participation]
      properties:
        user_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        account_state: { type: string, enum: [PENDING_PHONE, ACTIVE, LIMITED, SUSPENDED, DEACTIVATED, DELETION_PENDING, DELETED] }
        participation: { $ref: '#/components/schemas/Participation' }
    AccountResponse:
      type: object
      required: [id, account_state, participation]
      properties:
        id: { type: string, format: uuid }
        account_state: { type: string, enum: [PENDING_PHONE, ACTIVE, LIMITED, SUSPENDED, DEACTIVATED, DELETION_PENDING, DELETED] }
        participation: { $ref: '#/components/schemas/Participation' }
    SafeSessionResponse:
      type: object
      required: [id, authenticated_at, last_seen_at, expires_at, revoked_at, current]
      properties:
        id: { type: string, format: uuid }
        authenticated_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        current: { type: boolean }
    SessionListResponse:
      type: object
      required: [sessions]
      properties: { sessions: { type: array, items: { $ref: '#/components/schemas/SafeSessionResponse' } } }
    PhoneRequestResponse:
      type: object
      required: [status, challengeId]
      properties:
        status: { const: accepted }
        challengeId: { type: string, format: uuid }
    PhoneConfirmResponse:
      type: object
      required: [status, activated]
      properties:
        status: { const: verified }
        activated: { type: boolean }
    ProviderOverviewResponse:
      type: object
      required: [profile_id, account_id, provider_types, state, verification_status, display_name, bio, service_area]
      properties:
        profile_id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        provider_types: { type: array, items: { type: string, enum: [OWNER, INDEPENDENT_AGENT, PROPERTY_MANAGER] } }
        state: { type: string, enum: [DRAFT, PENDING_VERIFICATION, ACTIVE, RESTRICTED, SUSPENDED, CLOSED] }
        verification_status: { type: string, enum: [NOT_VERIFIED, PENDING, VERIFIED, REJECTED, NEEDS_RESUBMISSION] }
        display_name: { type: string }
        bio: { type: [string, 'null'] }
        service_area: { type: [string, 'null'] }
    PropertyCreateRequest:
      type: object
      required: [property_type, region, city, neighborhood, relationship_type]
      properties:
        property_type: { type: string, enum: [HOUSE, APARTMENT, ROOM, LAND, COMMERCIAL] }
        region: { type: string, enum: [Southwest, Littoral] }
        city: { type: string, minLength: 1, maxLength: 120 }
        neighborhood: { type: string, minLength: 1, maxLength: 160 }
        relationship_type: { type: string, enum: [OWNER, AUTHORIZED_AGENT, PROPERTY_MANAGER] }
        landmark: { type: string }
        bedrooms: { type: integer, minimum: 0 }
        bathrooms: { type: integer, minimum: 0 }
        size_sqm: { type: number, exclusiveMinimum: 0 }
        furnishing: { type: string, enum: [FURNISHED, UNFURNISHED, PARTLY_FURNISHED] }
    PropertySpecificationsUpdateRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        bedrooms: { type: [integer, 'null'], minimum: 0 }
        bathrooms: { type: [integer, 'null'], minimum: 0 }
        size_sqm: { type: [number, 'null'], exclusiveMinimum: 0 }
        furnishing: { type: [string, 'null'], enum: [FURNISHED, UNFURNISHED, PARTLY_FURNISHED, null] }
    PropertyDraftResponse:
      type: object
      required: [id, version, property_type, region, city, neighborhood, relationship_id, relationship_type, authorization_status, landmark, bedrooms, bathrooms, size_sqm, furnishing]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        property_type: { type: string, enum: [HOUSE, APARTMENT, ROOM, LAND, COMMERCIAL] }
        region: { type: string, enum: [Southwest, Littoral] }
        city: { type: string }
        neighborhood: { type: string }
        relationship_id: { type: string, format: uuid }
        relationship_type: { type: string, enum: [OWNER, AUTHORIZED_AGENT, PROPERTY_MANAGER] }
        authorization_status: { const: DECLARED }
        landmark: { type: [string, 'null'] }
        bedrooms: { type: [integer, 'null'] }
        bathrooms: { type: [integer, 'null'] }
        size_sqm: { type: [string, 'null'] }
        furnishing: { type: [string, 'null'] }
    ListingDraftCreateRequest:
      type: object
      required: [property_id, purpose]
      properties:
        property_id: { type: string, format: uuid }
        purpose: { type: string, enum: [RENT, SALE, SHORT_LET] }
        title: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 5000 }
        amount_minor: { type: integer, minimum: 0 }
        pricing_period: { type: string, enum: [MONTHLY, TOTAL, NIGHTLY] }
        negotiable: { type: boolean }
        deposit_amount_minor: { type: integer, minimum: 0 }
        advance_months: { type: integer, minimum: 0 }
        minimum_lease_months: { type: integer, exclusiveMinimum: 0 }
        utilities_included: { type: boolean }
        service_charge_amount_minor: { type: integer, minimum: 0 }
        weekly_amount_minor: { type: integer, minimum: 0 }
        minimum_nights: { type: integer, exclusiveMinimum: 0 }
        guest_limit: { type: integer, exclusiveMinimum: 0 }
        check_in_time: { type: string, format: time }
        check_out_time: { type: string, format: time }
        cleaning_fee_minor: { type: integer, minimum: 0 }
        available_from: { type: string, format: date }
    ListingDraftUpdateRequest:
      type: object
      properties:
        title: { type: [string, 'null'], maxLength: 160 }
        description: { type: [string, 'null'], maxLength: 5000 }
        amount_minor: { type: [integer, 'null'], minimum: 0 }
        pricing_period: { type: string, enum: [MONTHLY, TOTAL, NIGHTLY] }
        negotiable: { type: boolean }
        deposit_amount_minor: { type: [integer, 'null'], minimum: 0 }
        advance_months: { type: [integer, 'null'], minimum: 0 }
        minimum_lease_months: { type: [integer, 'null'], exclusiveMinimum: 0 }
        utilities_included: { type: [boolean, 'null'] }
        service_charge_amount_minor: { type: [integer, 'null'], minimum: 0 }
        weekly_amount_minor: { type: [integer, 'null'], minimum: 0 }
        minimum_nights: { type: [integer, 'null'], exclusiveMinimum: 0 }
        guest_limit: { type: [integer, 'null'], exclusiveMinimum: 0 }
        check_in_time: { type: [string, 'null'], format: time }
        check_out_time: { type: [string, 'null'], format: time }
        cleaning_fee_minor: { type: [integer, 'null'], minimum: 0 }
        available_from: { type: [string, 'null'], format: date }
    ListingDraftResponse:
      type: object
      required: [id, property_id, provider_account_id, purpose, publication_status, moderation_status, revision_id, version, offering_id, offering_version_id, currency, title, description, amount_minor, pricing_period, negotiable, deposit_amount_minor, advance_months, minimum_lease_months, utilities_included, service_charge_amount_minor, weekly_amount_minor, minimum_nights, guest_limit, check_in_time, check_out_time, cleaning_fee_minor, available_from]
      properties:
        id: { type: string, format: uuid }
        property_id: { type: string, format: uuid }
        provider_account_id: { type: string, format: uuid }
        purpose: { type: string, enum: [RENT, SALE, SHORT_LET] }
        publication_status: { type: string, enum: [DRAFT, PENDING_REVIEW] }
        moderation_status: { type: string, enum: [NOT_REVIEWED, IN_REVIEW] }
        revision_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        offering_id: { type: string, format: uuid }
        offering_version_id: { type: string, format: uuid }
        currency: { const: XAF }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        amount_minor: { type: [integer, 'null'] }
        pricing_period: { type: string, enum: [MONTHLY, TOTAL, NIGHTLY] }
        negotiable: { type: boolean }
        deposit_amount_minor: { type: [integer, 'null'] }
        advance_months: { type: [integer, 'null'] }
        minimum_lease_months: { type: [integer, 'null'] }
        utilities_included: { type: [boolean, 'null'] }
        service_charge_amount_minor: { type: [integer, 'null'] }
        weekly_amount_minor: { type: [integer, 'null'] }
        minimum_nights: { type: [integer, 'null'] }
        guest_limit: { type: [integer, 'null'] }
        check_in_time: { type: [string, 'null'], format: time }
        check_out_time: { type: [string, 'null'], format: time }
        cleaning_fee_minor: { type: [integer, 'null'] }
        available_from: { type: [string, 'null'], format: date }
    ListingMediaVariant:
      type: object
