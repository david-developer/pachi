      responses: { '200': { description: Safe interaction projection, content: { application/json: { schema: { $ref: '#/components/schemas/InteractionReadResponse' } } } }, '401': { description: Authentication required }, '404': { description: Interaction is unavailable } }
  /v1/account/conversations:
    get:
      security: [{ bearerAuth: [] }]
      description: Current seeker or individual-provider inbox, ordered by opened_at then interaction ID descending. Organization access fails closed. No body previews or private contacts.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: Participant inbox, content: { application/json: { schema: { $ref: '#/components/schemas/ConversationListResponse' } } } }
        '400': { description: Invalid pagination }
        '401': { description: Authentication required }
  /v1/account/conversations/{conversationId}/messages:
    parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      security: [{ bearerAuth: [] }]
      description: Current participant history, including CLOSED/RESTRICTED history. Descending server sequence; next_cursor loads older messages. can_send is a current safe capability projection; send rechecks it.
      parameters:
        - { name: cursor, in: query, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
      responses:
        '200': { description: Message page, content: { application/json: { schema: { $ref: '#/components/schemas/MessageListResponse' } } } }
        '400': { description: Invalid pagination }
        '401': { description: Authentication required }
        '404': { description: Conversation is unavailable }
    post:
      security: [{ bearerAuth: [] }]
      description: Current Conversation access is always required, including for replay; lost authority returns safe 404. An identical persisted authenticated sender/client_message_id request returns its existing safe Message with created=false even after state, block or send-eligibility changes; changed body or canonical Conversation conflicts. Only a genuinely new Message requires OPEN, current ACTIVE/phone/provider eligibility and no bilateral block. Atomic PostgreSQL fixed windows default to 20 per Conversation and 60 globally per sender per 60 seconds; persisted replay creates no message, receipt, event or rate unit. No external notification delivery is performed.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MessageSendRequest' } } } }
      responses:
        '201': { description: Persisted message (created distinguishes creation and replay), content: { application/json: { schema: { $ref: '#/components/schemas/MessageSendResponse' } } } }
        '400': { description: Invalid body or client message ID }
        '401': { description: Authentication required }
        '403': { description: Messaging unavailable; account, phone, block and restriction reasons are not disclosed }
        '404': { description: Conversation is unavailable }
        '409': { description: Conversation not open or conflicting client-message reuse }
        '429': { description: Message rate limit exceeded }
  /v1/account/conversations/{conversationId}/receipts:
    parameters: [{ name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      security: [{ bearerAuth: [] }]
      description: Explicit authenticated recipient acknowledgement. READ implies DELIVERED; timestamps are server-derived, monotonic and idempotent. Senders cannot acknowledge their own messages. No global Message read timestamp.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptRequest' } } } }
      responses:
        '201': { description: Persisted recipient receipts, content: { application/json: { schema: { $ref: '#/components/schemas/ReceiptResponse' } } } }
        '400': { description: Invalid acknowledgement }
        '401': { description: Authentication required }
        '404': { description: Conversation or recipient receipt is unavailable }
