    OwnBlockResponse: {"type": "object", "additionalProperties": false, "required": ["id", "subject_kind", "state", "created_at", "revoked_at", "version"], "properties": {"id": {"type": "string", "format": "uuid"}, "subject_kind": {"type": "string", "enum": ["USER", "PROVIDER_ACCOUNT"]}, "state": {"type": "string", "enum": ["ACTIVE", "REVOKED"]}, "created_at": {"type": "string", "format": "date-time"}, "revoked_at": {"type": ["string", "null"], "format": "date-time"}, "version": {"type": "integer", "minimum": 1}}}
