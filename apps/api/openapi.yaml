  /v1/account/organizations:
    get:
      security: [{"bearerAuth":[]}]
      description: "Organizations for the current active phone-confirmed member. Historical memberships confer no access."
      parameters: [{"name":"cursor","in":"query","schema":{"type":"string"}},{"name":"limit","in":"query","schema":{"type":"integer","minimum":1,"maximum":50,"default":20}}]
      responses:
        '200': {"description":"Safe current-authority projection; never invitation tokens, digests or private contacts","content":{"application/json":{"schema":{"$ref":"#/components/schemas/OrganizationListResponse"}}}}
        '400': {"description":"Invalid input, unknown fields or pagination"}
        '401': {"description":"Current registered authentication required"}
        '403': {"description":"Participation unavailable or privileged governance deferred"}
        '404': {"description":"Resource unavailable without existence or recipient disclosure"}
        '409': {"description":"Stale version, changed retry payload or unavailable invitation"}
    post:
      security: [{"bearerAuth":[]}]
      description: "Atomic organization, initial active OWNER and stable organization ProviderAccount. ACTIVE is separate from BUSINESS verification and does not permit publication. OTHER_APPROVED_PROVIDER remains unavailable; later OWNER/ADMIN changes use separate step-up-protected commands."
      parameters: [{"name":"Idempotency-Key","in":"header","required":true,"schema":{"type":"string","format":"uuid"}}]
      requestBody: {"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/OrganizationCreateRequest"}}}}
      responses:
        '201': {"description":"Safe current-authority projection; never invitation tokens, digests or private contacts","content":{"application/json":{"schema":{"$ref":"#/components/schemas/OrganizationSummary"}}}}
        '400': {"description":"Invalid input, unknown fields or pagination"}
        '401': {"description":"Current registered authentication required"}
        '403': {"description":"Participation unavailable or privileged governance deferred"}
        '404': {"description":"Resource unavailable without existence or recipient disclosure"}
        '409': {"description":"Stale version, changed retry payload or unavailable invitation"}
